[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortex-ai"
version = "0.1.0"
description = "Open-source AI Execution Engine — durable workflows, model gateway, semantic caching, guardrails, evaluation gates, and full observability."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Vortex Contributors" }]
keywords = ["ai", "llm", "agents", "orchestration", "mlops", "llmops", "execution-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # API
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "sse-starlette>=2.1.0,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "pgvector>=0.3.0,<1.0",

    # Redis
    "redis[hiredis]>=5.2.0,<6.0",

    # Observability
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "prometheus-client>=0.21.0,<1.0",
    "structlog>=24.4.0,<25.0",

    # LLM Providers
    "openai>=1.50.0,<2.0",
    "anthropic>=0.37.0,<1.0",
    "google-genai>=1.0.0,<2.0",
    "tiktoken>=0.8.0,<1.0",

    # Utilities
    "python-dotenv>=1.0.0,<2.0",
    "python-ulid>=3.0.0,<4.0",
    "orjson>=3.10.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-httpx>=0.32.0,<1.0",
    "testcontainers[postgres,redis]>=4.8.0,<5.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "black>=24.10.0,<25.0",
    "pre-commit>=4.0.0,<5.0",
    "factory-boy>=3.3.0,<4.0",
    "faker>=30.0.0,<31.0",
    "aiosqlite>=0.20.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/vortex-ai/vortex"
Documentation = "https://github.com/vortex-ai/vortex/tree/main/docs"
Repository = "https://github.com/vortex-ai/vortex"
Issues = "https://github.com/vortex-ai/vortex/issues"

[project.scripts]
vortex = "vortex.api.main:cli"

# ─── Build Configuration ──────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/vortex"]

# ─── Tool Configuration ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--tb=short",
    "--cov=src/vortex",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require database/redis)",
    "slow: Slow tests (excluded by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 150
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["S101", "S104", "B008", "E701", "SIM108", "A002", "S110", "E501", "S105", "F401", "SIM117", "UP042", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["vortex"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "vortex.api.routes.prompts",
    "vortex.api.routes.models",
    "vortex.gateway.router",
    "vortex.observability.logger",
    "vortex.storage.database",
    "vortex.engine.projector",
    "vortex.storage.lease",
    "vortex.engine.scheduler",
    "vortex.gateway.providers.groq",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/vortex"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
target-version = ["py311"]
line-length = 150
